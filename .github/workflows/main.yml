name: Pool & Weather Logger

on:
  repository_dispatch:
    types: [poll-pool]
  workflow_dispatch:

# Data is pushed to home_data with DATA_REPO_TOKEN, so this repo only needs
# read access, plus actions: write for the daily keep-enabled step below.
permissions:
  contents: read
  actions: write

# Overlapping runs would race on the CSVs and the push, so queue them instead.
concurrency:
  group: telemetry
  cancel-in-progress: false

jobs:
  scrape_and_log:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      # Data lives in a separate private repo so this public repo holds only code.
      - name: Checkout Private Data Repo
        uses: ./.github/actions/checkout-data
        with:
          token: ${{ secrets.DATA_REPO_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Telemetry Suite
        id: telemetry
        # Keep going so whatever data was collected still gets committed.
        continue-on-error: true
        env:
          IQUALINK_USER: ${{ secrets.IQUALINK_USER }}
          IQUALINK_PASS: ${{ secrets.IQUALINK_PASS }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          LAT: ${{ secrets.LAT }}
          LONG: ${{ secrets.LONG }}
        working-directory: data
        run: python ../main.py

      - name: Generate Job Summary
        # This makes the table appear on the Action run page
        if: always()
        run: cat data/job_summary.md >> $GITHUB_STEP_SUMMARY || echo "No summary generated" >> $GITHUB_STEP_SUMMARY

      - name: Commit and Push Data
        if: always()
        uses: ./.github/actions/push-data
        with:
          paths: "*.csv"
          message: Telemetry Update

      # A red run triggers GitHub's failure email. Only fail on sustained outages
      # (decided in main.py) or if the script crashed outright, not on one-off blips.
      - name: Raise Alert
        if: steps.telemetry.outputs.alert == 'true' || steps.telemetry.outcome == 'failure'
        run: |
          echo "::error::Telemetry needs attention - see the run summary for details"
          exit 1

      # Backup for the watchdog's keep-enabled step: GitHub disables scheduled
      # workflows in public repos after 60 days without commits, but this
      # workflow is triggered externally and is never disabled. Once a day,
      # re-enable the scheduled ones. Never fails the logging run.
      - name: Keep Scheduled Workflows Enabled
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "$(date -u +%H)" = "12" ] && [ "$(date -u +%M)" -lt 10 ] || exit 0
          for wf in energy.yml watchdog.yml; do
            curl -sS -f -X PUT -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/$wf/enable" && echo "Enabled $wf"
          done
