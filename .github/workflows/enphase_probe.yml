name: Enphase Probe

# Manual diagnostic: see investigation/enphase/probe.py. Uses ~20 API requests.
on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Leave blank for all endpoints, "ev" for the EV charger, or "config" for battery settings'
        required: false
        default: ''

permissions:
  contents: read

# Shares the queue with the energy logger: both rotate the refresh token.
concurrency:
  group: telemetry
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Checkout Private Data Repo
        uses: ./.github/actions/checkout-data
        with:
          token: ${{ secrets.DATA_REPO_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Probe Endpoints
        working-directory: data
        env:
          ENPHASE_API_KEY: ${{ secrets.ENPHASE_API_KEY }}
          ENPHASE_CLIENT_ID: ${{ secrets.ENPHASE_CLIENT_ID }}
          ENPHASE_CLIENT_SECRET: ${{ secrets.ENPHASE_CLIENT_SECRET }}
          ENPHASE_REFRESH_TOKEN: ${{ secrets.ENPHASE_REFRESH_TOKEN }}
          ENPHASE_SYSTEM_ID: ${{ secrets.ENPHASE_SYSTEM_ID }}
          GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
          ONLY: ${{ inputs.only }}
        run: python ../investigation/enphase/probe.py $ONLY

      - name: Generate Job Summary
        if: always()
        run: cat data/probe_summary.md >> $GITHUB_STEP_SUMMARY || true

      - name: Save Raw Responses
        if: always()
        uses: ./.github/actions/push-data
        with:
          paths: probe_results
          message: Enphase probe
