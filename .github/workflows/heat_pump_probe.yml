name: Heat Pump Probe

# Manual-only side experiment; see investigation/heat_pump/README.md
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Scenario label (e.g. both_off, hp_on, gas_on, both_on)'
        required: true

permissions:
  contents: write

# Share the main logger's queue so the two never push at the same moment.
concurrency:
  group: telemetry
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Checkout Private Data Repo
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          if [ -z "$DATA_REPO_TOKEN" ]; then
            echo "::error::DATA_REPO_TOKEN secret is missing - add it under Settings > Secrets and variables > Actions"
            exit 1
          fi
          git clone "https://x-access-token:${DATA_REPO_TOKEN}@github.com/${{ github.repository_owner }}/home_data.git" data
          git -C data checkout -B main origin/main 2>/dev/null || git -C data checkout -B main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install pytz httpx iaqualink==0.6.0

      - name: Capture Snapshot
        env:
          IQUALINK_USER: ${{ secrets.IQUALINK_USER }}
          IQUALINK_PASS: ${{ secrets.IQUALINK_PASS }}
          SCENARIO: ${{ inputs.scenario }}
          SNAPSHOT_DIR: data/probe_snapshots
        run: python investigation/heat_pump/probe.py "$SCENARIO"

      - name: Generate Job Summary
        run: cat probe_summary.md >> $GITHUB_STEP_SUMMARY

      - name: Commit and Push Snapshot
        working-directory: data
        run: |
          git config --global user.name "PoolBot"
          git config --global user.email "poolbot@github.com"
          git add probe_snapshots
          git commit -m "Probe: $SCENARIO" || exit 0
          for attempt in 1 2 3 4; do
            git pull --rebase origin main 2>/dev/null || true
            git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          exit 1
        env:
          SCENARIO: ${{ inputs.scenario }}
