name: Heat Pump Probe

# Manual-only side experiment; see investigation/heat_pump/README.md
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Scenario label (e.g. both_off, hp_on, gas_on, both_on)'
        required: true

permissions:
  contents: write

# Share the main logger's queue so the two never push at the same moment.
concurrency:
  group: telemetry
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Checkout Private Data Repo
        uses: ./.github/actions/checkout-data
        with:
          token: ${{ secrets.DATA_REPO_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install pytz httpx iaqualink==0.6.0

      - name: Capture Snapshot
        env:
          IQUALINK_USER: ${{ secrets.IQUALINK_USER }}
          IQUALINK_PASS: ${{ secrets.IQUALINK_PASS }}
          SCENARIO: ${{ inputs.scenario }}
          SNAPSHOT_DIR: data/probe_snapshots
        run: python investigation/heat_pump/probe.py "$SCENARIO"

      - name: Generate Job Summary
        run: cat probe_summary.md >> $GITHUB_STEP_SUMMARY

      - name: Commit and Push Snapshot
        uses: ./.github/actions/push-data
        with:
          paths: probe_snapshots
          message: Probe ${{ inputs.scenario }}
