name: Data Watchdog

# Checks every few hours that every data source is still being updated. A red
# run sends GitHub's failure email. It also keeps the scheduled workflows
# enabled: GitHub disables them in a public repo after 60 days without commits,
# and the data commits now go to the private home_data repo.
on:
  schedule:
    - cron: '23 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Keep Scheduled Workflows Enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in energy.yml watchdog.yml; do
            curl -sS -f -X PUT -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/$wf/enable" \
              && echo "Enabled $wf"
          done

      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Checkout Private Data Repo
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          if [ -z "$DATA_REPO_TOKEN" ]; then
            echo "::error::DATA_REPO_TOKEN secret is missing - add it under Settings > Secrets and variables > Actions"
            exit 1
          fi
          git clone --depth 1 "https://x-access-token:${DATA_REPO_TOKEN}@github.com/${{ github.repository_owner }}/home_data.git" data

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check Data Freshness
        working-directory: data
        run: |
          pip install -q pytz pandas
          python ../watchdog.py
