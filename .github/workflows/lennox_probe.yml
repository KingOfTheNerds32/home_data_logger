name: Lennox Probe

# Manual diagnostic: see investigation/lennox/probe.py. Read-only.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telemetry
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Checkout Private Data Repo
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          git clone "https://x-access-token:${DATA_REPO_TOKEN}@github.com/${{ github.repository_owner }}/home_data.git" data
          git -C data checkout -B main origin/main 2>/dev/null || git -C data checkout -B main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install lennoxs30api

      - name: Probe Thermostats
        working-directory: data
        env:
          LENNOX_USER: ${{ secrets.LENNOX_USER }}
          LENNOX_PASS: ${{ secrets.LENNOX_PASS }}
        run: python ../investigation/lennox/probe.py

      - name: Generate Job Summary
        if: always()
        run: cat data/lennox_probe_summary.md >> $GITHUB_STEP_SUMMARY || true

      - name: Save Results
        if: always()
        working-directory: data
        run: |
          [ -f lennox_probe.json ] || exit 0
          git config --global user.name "PoolBot"
          git config --global user.email "poolbot@github.com"
          git add lennox_probe.json
          git commit -m "Lennox probe: $(date)" || exit 0
          for attempt in 1 2 3 4; do
            git pull --rebase origin main 2>/dev/null || true
            git push origin HEAD:main && exit 0
            sleep $((attempt * 5))
          done
          exit 1
