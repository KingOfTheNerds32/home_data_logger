name: Lennox Probe

# Manual diagnostic: see investigation/lennox/probe.py. Read-only.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telemetry
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Checkout Private Data Repo
        uses: ./.github/actions/checkout-data
        with:
          token: ${{ secrets.DATA_REPO_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install lennoxs30api

      - name: Probe Thermostats
        working-directory: data
        env:
          LENNOX_USER: ${{ secrets.LENNOX_USER }}
          LENNOX_PASS: ${{ secrets.LENNOX_PASS }}
        run: python ../investigation/lennox/probe.py

      - name: Generate Job Summary
        if: always()
        run: cat data/lennox_probe_summary.md >> $GITHUB_STEP_SUMMARY || true

      - name: Save Results
        if: always()
        uses: ./.github/actions/push-data
        with:
          paths: lennox_probe.json
          message: Lennox probe
