name: Energy Logger

# Daily Enphase pull plus a budgeted history backfill; see energy_logger.py.
on:
  schedule:
    - cron: '17 11 * * *'  # ~3-4 AM Pacific, after the day is complete
  workflow_dispatch:

permissions:
  contents: read

# Share the logger queue so pushes to the data repo never collide.
concurrency:
  group: telemetry
  cancel-in-progress: false

jobs:
  energy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Checkout Private Data Repo
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          if [ -z "$DATA_REPO_TOKEN" ]; then
            echo "::error::DATA_REPO_TOKEN secret is missing - add it under Settings > Secrets and variables > Actions"
            exit 1
          fi
          git clone "https://x-access-token:${DATA_REPO_TOKEN}@github.com/${{ github.repository_owner }}/home_data.git" data
          git -C data checkout -B main origin/main 2>/dev/null || git -C data checkout -B main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install pandas pytz requests pynacl

      # A failure here turns the run red, which triggers GitHub's failure email.
      - name: Pull Enphase Data
        working-directory: data
        env:
          ENPHASE_API_KEY: ${{ secrets.ENPHASE_API_KEY }}
          ENPHASE_CLIENT_ID: ${{ secrets.ENPHASE_CLIENT_ID }}
          ENPHASE_CLIENT_SECRET: ${{ secrets.ENPHASE_CLIENT_SECRET }}
          ENPHASE_REFRESH_TOKEN: ${{ secrets.ENPHASE_REFRESH_TOKEN }}
          ENPHASE_SYSTEM_ID: ${{ secrets.ENPHASE_SYSTEM_ID }}
          ENPHASE_EV_SERIAL: ${{ secrets.ENPHASE_EV_SERIAL }}
          GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
        run: python ../energy_logger.py

      # Always push, so the request count in enphase_state.json is kept even
      # if the pull failed partway.
      - name: Commit and Push Data
        if: always()
        working-directory: data
        run: |
          [ -d .git ] || exit 0
          git config --global user.name "PoolBot"
          git config --global user.email "poolbot@github.com"
          for f in energy_history.csv production_5min.csv ev_sessions.csv energy_daily.csv enphase_state.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git commit -m "Energy Update: $(date)" || exit 0
          for attempt in 1 2 3 4; do
            git pull --rebase origin main 2>/dev/null || true
            git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "Failed to push energy data after 4 attempts"
          exit 1
