name: Energy Logger

# Daily Enphase pull plus a budgeted history backfill; see energy_logger.py.
on:
  schedule:
    - cron: '17 11 * * *'  # ~3-4 AM Pacific, after the day is complete
  workflow_dispatch:

permissions:
  contents: read

# Share the logger queue so pushes to the data repo never collide.
concurrency:
  group: telemetry
  cancel-in-progress: false

jobs:
  energy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Checkout Private Data Repo
        uses: ./.github/actions/checkout-data
        with:
          token: ${{ secrets.DATA_REPO_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      # A failure here turns the run red, which triggers GitHub's failure email.
      - name: Pull Enphase Data
        working-directory: data
        env:
          ENPHASE_API_KEY: ${{ secrets.ENPHASE_API_KEY }}
          ENPHASE_CLIENT_ID: ${{ secrets.ENPHASE_CLIENT_ID }}
          ENPHASE_CLIENT_SECRET: ${{ secrets.ENPHASE_CLIENT_SECRET }}
          ENPHASE_REFRESH_TOKEN: ${{ secrets.ENPHASE_REFRESH_TOKEN }}
          ENPHASE_SYSTEM_ID: ${{ secrets.ENPHASE_SYSTEM_ID }}
          ENPHASE_EV_SERIAL: ${{ secrets.ENPHASE_EV_SERIAL }}
          GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
        run: python ../energy_logger.py

      # Daily sunlight and weather from Open-Meteo's archive, to compare solar
      # output between years on equal sun. Independent of Enphase.
      - name: Pull Sunlight History
        if: always()
        working-directory: data
        env:
          LAT: ${{ secrets.LAT }}
          LONG: ${{ secrets.LONG }}
        run: python ../sunlight_logger.py

      # Always push, so the request count in enphase_state.json is kept even
      # if the pull failed partway.
      - name: Commit and Push Data
        if: always()
        uses: ./.github/actions/push-data
        with:
          paths: energy_history.csv production_5min.csv ev_sessions.csv energy_daily.csv battery_days.csv enphase_state.json sunlight_daily.csv
          message: Energy Update
