# AppDaemon apps for Home Assistant on the Pi. The updater keeps this file and
# home_export.py in sync with the home_data_logger repo, so edits deploy by
# merging on GitHub (see homeassistant/README.md).

updater:
  module: updater
  class: Updater
  repo: KingOfTheNerds32/home_data_logger
  branch: main
  interval_minutes: 30
  files:
    homeassistant/appdaemon/apps.yaml: apps.yaml
    homeassistant/appdaemon/home_export.py: home_export.py
    homeassistant/appdaemon/outage_hvac.py: outage_hvac.py
    homeassistant/appdaemon/burst_recorder.py: burst_recorder.py

home_export:
  module: home_export
  class: HomeExport
  github_token: !secret github_home_data_token
  repo: KingOfTheNerds32/home_data
  folder: ha
  interval_minutes: 5
  fast_interval_minutes: 1
  # Snapshot every minute: whole-home and battery power, which the Envoy
  # updates about once a minute, to catch short loads (pump, AC cycles).
  sample_fast:
    - "sensor.gateway_envoy_*_current_*"        # whole-home production / consumption / grid (kW)
    - "sensor.gateway_envoy_*_production_ct_power"
    - "sensor.gateway_envoy_*_lifetime_*"       # cumulative counters: exact energy between readings
    - "sensor.battery_encharge_*[0-9]_power"    # per-battery charge/discharge power
  # Snapshot every interval: readings such as temperatures and per-panel output.
  sample:
    - "sensor.gateway_envoy_*_battery"          # battery state of charge (%)
    - "sensor.gateway_envoy_*_available_battery_energy"
    - "sensor.inverter_*"                       # per-panel output (microinverters report ~5 min)
    - "sensor.battery_encharge_*_battery"       # per-battery state of charge
    - "sensor.*_indoor_blower_power"            # furnace blower watts
    - "sensor.*_indoor_blower_rpm"
    - "sensor.*_blower_cfm_demand"
    - "sensor.*_discharge_air_temperature"
    - "sensor.*shared_spaces_outdoor_temperature"
    - "sensor.*_inverter_energy"                # AC compressor energy (needs diagnostics)
    - "sensor.flume_sensor_home_current"        # water flow rate
    - "sensor.flume_sensor_home_current_day"
    - "sensor.pool_temp"
    - "sensor.spa_temp"
    - "sensor.air_temp"
    - "sensor.ph"                               # pool chemistry
    - "sensor.orp"
  # Recorded on every change: on/off and mode-type states.
  on_change:
    - "climate.*"                               # HVAC zones + pool/spa set points
    - "sensor.*_damper_open"                    # zone dampers
    - "sensor.*_central_mode"
    - "switch.pool_pump"
    - "switch.spa_pump"
    - "switch.pool_heater"
    - "switch.spa_heater"
    - "switch.spillover"
    - "light.pool_light"
    - "light.spa_light"
    - "binary_sensor.*_grid_status"             # grid up/down (outages)
    - "select.*_storage_mode"                   # battery profile
    - "switch.*_charge_from_grid"
    - "number.*_reserve_battery_level"
    - "binary_sensor.flume_sensor_home_leak_detected"
    - "sensor.cover_pool"                       # iAquaLink "cover" (may not reflect the real cover)
    - "binary_sensor.*_watering"                # Hydrawise zone running
    - "binary_sensor.*_rain_sensor"
    - "sensor.*_daily_active_watering_time"     # Hydrawise minutes watered today
    - "cover.*"                                 # PowerView shades (with position)
    - "water_heater.*"                          # Rinnai: temperature and setpoint
    - "*_recirculation"                         # Rinnai recirculation pump running / enabled
  exclude:
    - "*_alert*"
    - "*wt_env*"
    - "*_last_reported"

# Turns the HVAC zones off during a grid outage and back on afterwards
# (see outage_hvac.py).
outage_hvac:
  module: outage_hvac
  class: OutageHvac
  grid_entity: binary_sensor.iq_system_controller_enpower_482251014142_grid_status
  zones:
    - "climate.bedrooms_*"
    - "climate.shared_spaces_*"
  off_after_seconds: 60          # grid down this long before turning zones off
  restore_after_seconds: 300     # grid back this long before turning them on
  battery_entity: sensor.gateway_envoy_202248184361_battery   # shown in notifications
  test_entity: input_boolean.simulate_grid_outage   # optional helper for testing
  # Phone alerts go to every phone with the Home Assistant Companion app; to
  # pick specific ones instead, list them, e.g.  notify: [notify/mobile_app_my_phone]

# Reads the gateway's meters and batteries every second, all day, to catch
# fast power swings (see burst_recorder.py). Needs envoy_token in
# secrets.yaml. Narrow start/end to shorten the window.
burst_recorder:
  module: burst_recorder
  class: BurstRecorder
  envoy_host: envoy.local
  start: "00:00"
  end: "23:59:59"
  until: 2026-11-14
